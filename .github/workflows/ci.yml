# Copy this file to `.github/workflows/ci.yml` to enable CI.
#
# This is shipped as a template because the GitHub App used by Devin does not
# hold the `workflow` scope required to add or modify files under
# `.github/workflows/`. Once a maintainer with the right scope copies this
# file into place, every push and PR to `main` will run ktlint, detekt, and
# `assembleDebug`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Detekt & Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon --stacktrace

      - name: detekt
        run: ./gradlew detekt --no-daemon --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          retention-days: 7
